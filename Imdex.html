<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mubina opash ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #080014;
  font-family: Arial, sans-serif;
  color: white;
}

.stars {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, white 1px, transparent 2px),
    radial-gradient(circle at 70% 20%, white 1px, transparent 2px),
    radial-gradient(circle at 40% 80%, white 1px, transparent 2px),
    radial-gradient(circle at 90% 70%, white 1px, transparent 2px);
  background-size: 120px 120px;
  animation: move 8s linear infinite;
}

@keyframes move {
  from { transform: scale(1); }
  to { transform: scale(1.3); }
}

.card {
  position: relative;
  z-index: 2;
  width: 90%;
  max-width: 420px;
  padding: 35px 25px;
  text-align: center;
  border-radius: 30px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  backdrop-filter: blur(12px);
  box-shadow: 0 0 50px rgba(255,70,150,0.4);
  animation: appear 2s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(0.3) rotate(-10deg);
  }
  to {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}

.heart {
  font-size: 75px;
  animation: beat 1s infinite;
}

@keyframes beat {
  50% { transform: scale(1.25); }
}

h1 {
  font-size: 40px;
  margin: 15px 0;
  text-shadow: 0 0 20px #ff4f9a;
}

p {
  font-size: 19px;
  line-height: 1.6;
}

button {
  margin-top: 15px;
  padding: 13px 25px;
  border: none;
  border-radius: 30px;
  background: white;
  color: #d92d75;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#secret {
  display: none;
  margin-top: 20px;
  animation: appear 1s ease;
}

.floating {
  position: fixed;
  bottom: -30px;
  font-size: 25px;
  animation: fly 5s linear infinite;
}

@keyframes fly {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="card">
  <div class="heart">❤️</div>

  <h1>Mubina opash</h1>

  <p>
    Siz uchun kichkina bir syurpriz... ✨
  </p>

  <button onclick="showSecret()">
    Ochish 😳
  </button>

  <div id="secret">
    <h2>💖 Mubina opash 💖</h2>
    <p>
      Sizni juda yaxshi ko‘raman ❤️<br>
      Har doim baxtli va kulib yuring! 🌷
    </p>
  </div>
</div>

<script>
function showSecret() {
  document.getElementById("secret").style.display = "block";

  for (let i = 0; i < 25; i++) {
    let heart = document.createElement("div");
    heart.className = "floating";
    heart.innerHTML = ["❤️","💖","💕","✨","🌷"][Math.floor(Math.random()*5)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
  }
}
</script>

</body>
</html>
